<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowstate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body, #root {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-fade-in {
        animation: fadeIn 0.8s ease-out forwards;
      }

      @keyframes highlight-card {
        0% { box-shadow: 0 0 0 0px var(--color-ring); }
        50% { box-shadow: 0 0 0 4px var(--color-ring); }
        100% { box-shadow: 0 0 0 0px var(--color-ring); }
      }

      .card-highlight {
        animation: highlight-card 1.5s ease-out;
      }

      /* --- THEME DEFINITIONS --- */
      :root, .theme-default-light {
        --color-bg-primary: #f9fafb;
        --color-bg-secondary: #ffffff;
        --color-bg-tertiary: #f3f4f6;
        --color-bg-primary-alpha: rgba(249, 250, 251, 0.5);
        --color-bg-secondary-alpha: rgba(255, 255, 255, 0.8);
        --color-text-primary: #1f2937;
        --color-text-secondary: #4b5563;
        --color-text-tertiary: #9ca3af;
        --color-text-inverted: #ffffff;
        --color-border-primary: #e5e7eb;
        --color-border-secondary: #d1d5db;
        --color-element-primary: #d1d5db;
        --color-element-primary-hover: #9ca3af;
        --color-accent-primary: #3b82f6;
        --color-accent-primary-hover: #2563eb;
        --color-accent-secondary: #10b981;
        --color-accent-secondary-hover: #059669;
        --color-accent-text: #ffffff;
        --color-accent-subtle-bg: #eff6ff;
        --color-accent-subtle-border: #bfdbfe;
        --color-accent-subtle-text: #1e40af;
        --color-danger-bg: #fee2e2;
        --color-danger-text: #dc2626;
        --color-ring: #60a5fa;
        --splash-bg: #10111a;
        --splash-text-primary: #f0eefc;
        --splash-text-secondary: #c4b5fd;

        --line-height-paragraph: 1.45;
        --spacing-paragraph: 0.8em;
      }

      .theme-slate-dark {
        --color-bg-primary: #0f172a;
        --color-bg-secondary: #1e293b;
        --color-bg-tertiary: #334155;
        --color-bg-primary-alpha: rgba(15, 23, 42, 0.5);
        --color-bg-secondary-alpha: rgba(30, 41, 59, 0.8);
        --color-text-primary: #e2e8f0;
        --color-text-secondary: #94a3b8;
        --color-text-tertiary: #64748b;
        --color-text-inverted: #ffffff;
        --color-border-primary: #334155;
        --color-border-secondary: #475569;
        --color-element-primary: #334155;
        --color-element-primary-hover: #475569;
        --color-accent-primary: #60a5fa;
        --color-accent-primary-hover: #3b82f6;
        --color-accent-secondary: #34d399;
        --color-accent-secondary-hover: #10b981;
        --color-accent-text: #0f172a;
        --color-accent-subtle-bg: #1e293b;
        --color-accent-subtle-border: #475569;
        --color-accent-subtle-text: #93c5fd;
        --color-danger-bg: #3f1212;
        --color-danger-text: #f87171;
        --color-ring: #60a5fa;
        --splash-bg: #0f172a;
        --splash-text-primary: #f0eefc;
        --splash-text-secondary: #c4b5fd;
      }
      
      .theme-midnight {
        --color-bg-primary: #111827;
        --color-bg-secondary: #1f2937;
        --color-bg-tertiary: #374151;
        --color-bg-primary-alpha: rgba(17, 24, 39, 0.5);
        --color-bg-secondary-alpha: rgba(31, 41, 55, 0.8);
        --color-text-primary: #d1d5db;
        --color-text-secondary: #9ca3af;
        --color-text-tertiary: #6b7280;
        --color-text-inverted: #ffffff;
        --color-border-primary: #374151;
        --color-border-secondary: #4b5563;
        --color-element-primary: #374151;
        --color-element-primary-hover: #4b5563;
        --color-accent-primary: #7c3aed;
        --color-accent-primary-hover: #6d28d9;
        --color-accent-secondary: #ec4899;
        --color-accent-secondary-hover: #db2777;
        --color-accent-text: #ffffff;
        --color-accent-subtle-bg: #1f2937;
        --color-accent-subtle-border: #4b5563;
        --color-accent-subtle-text: #a78bfa;
        --color-danger-bg: #450a0a;
        --color-danger-text: #fca5a5;
        --color-ring: #a78bfa;
        --splash-bg: #111827;
        --splash-text-primary: #f0eefc;
        --splash-text-secondary: #c4b5fd;
      }

      .theme-oasis {
        --color-bg-primary: #f0f9ff; /* sky-50 */
        --color-bg-secondary: #ffffff;
        --color-bg-tertiary: #e0f2fe; /* sky-100 */
        --color-bg-primary-alpha: rgba(240, 249, 255, 0.5);
        --color-bg-secondary-alpha: rgba(255, 255, 255, 0.8);
        --color-text-primary: #334155; /* slate-700 */
        --color-text-secondary: #64748b; /* slate-500 */
        --color-text-tertiary: #94a3b8; /* slate-400 */
        --color-text-inverted: #ffffff;
        --color-border-primary: #bae6fd; /* sky-200 */
        --color-border-secondary: #7dd3fc; /* sky-300 */
        --color-element-primary: #ccfbf1; /* teal-100 */
        --color-element-primary-hover: #99f6e4; /* teal-200 */
        --color-accent-primary: #c89656;
        --color-accent-primary-hover: #b08247;
        --color-accent-secondary: #1874a5;
        --color-accent-secondary-hover: #125a80;
        --color-accent-text: #ffffff;
        --color-accent-subtle-bg: #e0f2fe; /* sky-100 */
        --color-accent-subtle-border: #bae6fd; /* sky-200 */
        --color-accent-subtle-text: #075985; /* sky-800 */
        --color-danger-bg: #fee2e2;
        --color-danger-text: #dc2626;
        --color-ring: #eab676;
        --splash-bg: #134e4a; /* teal-900 */
        --splash-text-primary: #f0fdfa; /* teal-50 */
        --splash-text-secondary: #67e8f9; /* cyan-300 */
      }
      
      .theme-desert-sunset {
        --color-bg-primary: #e0f0f3;
        --color-bg-secondary: #ffffff;
        --color-bg-tertiary: #d4e8ec;
        --color-bg-primary-alpha: rgba(224, 240, 243, 0.5);
        --color-bg-secondary-alpha: rgba(255, 255, 255, 0.8);
        --color-text-primary: #2b1f1a;
        --color-text-secondary: #914d33;
        --color-text-tertiary: #b5755b;
        --color-text-inverted: #ffffff;
        --color-border-primary: #cce2e8;
        --color-border-secondary: #6cb7d3;
        --color-element-primary: #e0b48b;
        --color-element-primary-hover: #d4a373;
        --color-accent-primary: #1f6a94;
        --color-accent-primary-hover: #1a587d;
        --color-accent-secondary: #d2794e;
        --color-accent-secondary-hover: #b6653e;
        --color-accent-text: #ffffff;
        --color-accent-subtle-bg: #cce2e8;
        --color-accent-subtle-border: #6cb7d3;
        --color-accent-subtle-text: #1f6a94;
        --color-danger-bg: #fee2e2;
        --color-danger-text: #dc2626;
        --color-ring: #47c3e1;
        --splash-bg: #2b1f1a;
        --splash-text-primary: #e0f0f3;
        --splash-text-secondary: #e0b48b;
      }

      body {
        background-color: var(--color-bg-primary);
      }
      
      /* --- CUSTOM SCROLLBAR --- */
      /* For Webkit Browsers */
      ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
      }
      ::-webkit-scrollbar-track {
          background: transparent;
      }
      ::-webkit-scrollbar-thumb {
          background-color: hsla(0,0%,50%,.2);
          border-radius: 10px;
      }
      *:hover::-webkit-scrollbar-thumb {
          background-color: var(--color-element-primary);
      }
      ::-webkit-scrollbar-thumb:hover {
          background-color: var(--color-element-primary-hover);
      }
      /* For Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--color-element-primary) transparent;
      }

      /* Basic styling for rendered markdown in the preview pane */
      .prose-preview h1, .prose-preview h2, .prose-preview h3, .prose-preview h4, .prose-preview h5, .prose-preview h6 {
          font-weight: 700;
          margin-top: 1.25em;
          margin-bottom: 0.5em;
          line-height: 1.2;
      }
      .prose-preview h1 { font-size: 2em; }
      .prose-preview h2 { font-size: 1.5em; }
      .prose-preview h3 { font-size: 1.25em; }
      .prose-preview h4 { font-size: 1.125em; }
      .prose-preview p { 
        line-height: var(--line-height-paragraph, 1.55);
        margin-top: var(--spacing-paragraph, 0.8em);
        margin-bottom: var(--spacing-paragraph, 0.8em);
      }
      .prose-preview ul, .prose-preview ol {
          margin-left: 1.5em;
          margin-top: 1em;
          margin-bottom: 1em;
      }
      .prose-preview ul { list-style-type: disc; }
      .prose-preview ol { list-style-type: decimal; }
      .prose-preview li { margin-bottom: 0.25em; }
      .prose-preview strong { font-weight: 700; }
      .prose-preview em { font-style: italic; }
      .prose-preview a { color: var(--color-accent-primary); text-decoration: underline; }
      .prose-preview blockquote {
          border-left: 4px solid var(--color-border-secondary);
          padding-left: 1em;
          margin-left: 0;
          font-style: italic;
          color: var(--color-text-secondary);
      }

      /* Basic styling for rendered markdown on cards */
      .prose-card h1, .prose-card h2, .prose-card h3, .prose-card h4, .prose-card h5, .prose-card h6 {
          margin-top: 0.5em;
          margin-bottom: 0.25em;
          line-height: 1.2;
      }
      .prose-card h1 { font-size: 1.4em; font-weight: 700; }
      .prose-card h2 { font-size: 1.2em; font-weight: 700; }
      .prose-card h3 { font-size: 1.1em; font-weight: 700; }
      .prose-card h4 { font-size: 1.0em; font-weight: 700; }
      .prose-card p {
        line-height: var(--line-height-paragraph, 1.45);
        margin-top: calc(var(--spacing-paragraph, 0.8em) * 0.8);
        margin-bottom: calc(var(--spacing-paragraph, 0.8em) * 0.8);
        white-space: pre-wrap;
      }
      .prose-card ul, .prose-card ol {
          margin-left: 1.25em;
          margin-top: 0.5em;
          margin-bottom: 0.5em;
          padding-left: 0;
      }
      .prose-card ul { list-style-type: disc; }
      .prose-card ol { list-style-type: decimal; }
      .prose-card li { margin-bottom: 0.1em; }
      .prose-card strong { font-weight: 700; }
      .prose-card em { font-style: italic; }
      .prose-card a { color: var(--color-accent-primary); text-decoration: underline; }
      .prose-card blockquote {
          border-left: 3px solid var(--color-border-secondary);
          padding-left: 0.75em;
          margin: 0.5em 0;
          font-style: italic;
          color: var(--color-text-secondary);
      }
      .prose-card > *:first-child { margin-top: 0; }
      .prose-card > *:last-child { margin-bottom: 0; }

    </style>

{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
